<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
    #mensagem { min-height: 1.5em; }
    #mensagem.erro { color: #b00020; }
    #mensagem.sucesso { color: #176b2c; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="doador">Doador (nome do estabelecimento)</label>
    <input id="doador" placeholder="Ex.: Padaria Pão Bom" autocomplete="organization">
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até (mín. 2h a partir de agora)</label>
    <input id="validade" type="datetime-local">
    <button id="publicar">Publicar</button>
  </fieldset>

  <label for="ong">ONG atual</label>
  <input id="ong" value="Minha ONG">
  <label for="voluntario">Voluntário que buscou (primeiro nome)</label>
  <input id="voluntario" placeholder="Ex.: Rui">
  <label for="motivo">Motivo, se a ONG for devolver uma doação</label>
  <input id="motivo" placeholder="Ex.: sem voluntário hoje">
  <p id="mensagem" role="status" aria-live="polite"></p>

  <h2>Minhas doações</h2>
  <ul id="minhas"></ul>

  <h2>Doações disponíveis</h2>
  <ul id="lista"></ul>

  <h2>Pendências de coleta da ONG</h2>
  <ul id="pendencias"></ul>

  <h2>Histórico de coletas</h2>
  <ul id="historico"></ul>

  <h2>Resultado do mês (coordenação)</h2>
  <label for="mes">Mês</label>
  <input id="mes" type="month">
  <button id="ver-resultado">Ver resultado</button>
  <p id="resultado"></p>

  <script>
    function mostrarMensagem(texto, tipo) {
      const mensagem = document.getElementById('mensagem');
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    async function lerResposta(res) {
      const corpo = await res.json();
      if (!res.ok) throw new Error(corpo.erro || `Erro HTTP ${res.status}`);
      return corpo;
    }

    // H1: sem login, o doador se identifica pelo nome digitado, guardado neste navegador.
    const armazenamento = typeof localStorage !== 'undefined' ? localStorage : null;
    const campoDoador = document.getElementById('doador');
    if (armazenamento && armazenamento.getItem('doador')) {
      campoDoador.value = armazenamento.getItem('doador');
    }

    async function carregarMinhas() {
      const lista = document.getElementById('minhas');
      const doador = campoDoador.value.trim();
      if (!doador) {
        lista.innerHTML = '<li>Informe o nome do doador para ver suas doações.</li>';
        return;
      }
      const doacoes = await fetch(`/api/doacoes/minhas?doador=${encodeURIComponent(doador)}`)
        .then(lerResposta);
      lista.innerHTML = doacoes.length ? '' : '<li>Você ainda não publicou doações.</li>';
      for (const doacao of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${doacao.tipo} — ${doacao.quantidade}: ${doacao.situacao}`;
        lista.appendChild(li);
      }
    }

    async function carregar() {
      try {
        await carregarMinhas();
        const ong = document.getElementById('ong').value.trim();
        const [doacoes, pendencias, historico] = await Promise.all([
          fetch('/api/doacoes').then(lerResposta),
          fetch(`/api/doacoes/pendencias?ong=${encodeURIComponent(ong)}`).then(lerResposta),
          fetch(`/api/doacoes/historico?ong=${encodeURIComponent(ong)}`).then(lerResposta)
        ]);
        renderizarLista('lista', doacoes, 'Nenhuma doação disponível.', 'aceitar');
        renderizarLista('pendencias', pendencias, 'Nenhuma pendência de coleta.', 'confirmar');
        renderizarLista('historico', historico, 'Nenhuma coleta confirmada.', 'historico');
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
      }
    }

    function renderizarLista(idLista, doacoes, vazio, acao) {
      const lista = document.getElementById(idLista);
      lista.innerHTML = doacoes.length ? '' : `<li>${vazio}</li>`;
      for (const doacao of doacoes) {
        const li = document.createElement('li');
        if (acao === 'historico') {
          li.textContent = `${doacao.tipo} — ${doacao.quantidade} (coletada por ${doacao.voluntario} em ${doacao.coletada_em})`;
        } else {
          li.textContent = `${doacao.tipo} — ${doacao.quantidade} (até ${doacao.validade}) `;
          const botao = document.createElement('button');
          botao.textContent = acao === 'confirmar' ? 'Confirmar Coleta' : 'Aceitar';
          botao.onclick = () => acao === 'confirmar'
            ? confirmarColeta(doacao.id)
            : aceitar(doacao.id);
          li.appendChild(botao);
          if (acao === 'confirmar') {
            const devolverBotao = document.createElement('button');
            devolverBotao.textContent = 'Devolver';
            devolverBotao.onclick = () => devolver(doacao.id);
            li.appendChild(devolverBotao);
          }
        }
        lista.appendChild(li);
      }
    }

    async function aceitar(id) {
      try {
        const ong = document.getElementById('ong').value.trim();
        const doacao = await fetch(`/api/doacoes/${id}/aceitar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ong })
        }).then(lerResposta);
        mostrarMensagem(`Reserva exclusiva confirmada para ${doacao.ong}.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
        await carregar();
      }
    }

    async function confirmarColeta(id) {
      try {
        const ong = document.getElementById('ong').value.trim();
        const voluntario = document.getElementById('voluntario').value.trim();
        const doacao = await fetch(`/api/doacoes/${id}/confirmar-coleta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ong, voluntario })
        }).then(lerResposta);
        mostrarMensagem(`Coleta confirmada por ${doacao.voluntario} para ${doacao.ong}.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
        await carregar();
      }
    }

    async function devolver(id) {
      try {
        const ong = document.getElementById('ong').value.trim();
        const motivo = document.getElementById('motivo').value.trim();
        const doacao = await fetch(`/api/doacoes/${id}/devolver`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ong, motivo })
        }).then(lerResposta);
        mostrarMensagem(`Doação #${doacao.id} devolvida para a lista de disponíveis (motivo: ${doacao.motivo}).`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
        await carregar();
      }
    }

    // H4: resultado do mês para a Marta (contado pelo mês da publicação).
    document.getElementById('ver-resultado').onclick = async () => {
      const saida = document.getElementById('resultado');
      try {
        const mes = document.getElementById('mes').value;
        const r = await fetch(`/api/relatorios/mes?mes=${encodeURIComponent(mes)}`).then(lerResposta);
        saida.textContent = `${r.mes}: ${r.publicadas} publicadas · ${r.aceitas} aceitas · `
          + `${r.coletadas} coletadas · ${r.devolucoes} devoluções · `
          + `tempo médio até a coleta: ${r.tempoMedioAteColeta}`;
      } catch (erro) {
        saida.textContent = erro.message;
      }
    };

    document.getElementById('ong').onchange = carregar;
    campoDoador.onchange = () => {
      if (armazenamento) armazenamento.setItem('doador', campoDoador.value.trim());
      return carregar();
    };

    document.getElementById('publicar').onclick = async () => {
      try {
        const doacao = await fetch('/api/doacoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tipo: document.getElementById('tipo').value,
            quantidade: document.getElementById('quantidade').value,
            validade: document.getElementById('validade').value,
            doador: campoDoador.value
          })
        }).then(lerResposta);
        mostrarMensagem(`Doação #${doacao.id} publicada com sucesso.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
      }
    };

    carregar();
  </script>
</body>
</html>
