<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
    #mensagem { min-height: 1.5em; }
    #mensagem.erro { color: #b00020; }
    #mensagem.sucesso { color: #176b2c; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até (mín. 2h a partir de agora)</label>
    <input id="validade" type="datetime-local">
    <button id="publicar">Publicar</button>
  </fieldset>

  <label for="ong">ONG atual</label>
  <input id="ong" value="Minha ONG">
  <p id="mensagem" role="status" aria-live="polite"></p>

  <h2>Doações disponíveis</h2>
  <ul id="lista"></ul>

  <h2>Minhas pendências de retirada</h2>
  <ul id="pendencias"></ul>

  <h2>Histórico de retiradas</h2>
  <ul id="historico"></ul>

  <script>
    function mostrarMensagem(texto, tipo) {
      const mensagem = document.getElementById('mensagem');
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    async function lerResposta(res) {
      const corpo = await res.json();
      if (!res.ok) throw new Error(corpo.erro || `Erro HTTP ${res.status}`);
      return corpo;
    }

    async function carregar() {
      try {
        const ong = document.getElementById('ong').value.trim();
        const [doacoes, pendencias, historico] = await Promise.all([
          fetch('/api/doacoes').then(lerResposta),
          fetch(`/api/doacoes/pendencias?ong=${encodeURIComponent(ong)}`).then(lerResposta),
          fetch(`/api/doacoes/historico?ong=${encodeURIComponent(ong)}`).then(lerResposta)
        ]);
        renderizarLista('lista', doacoes, 'Nenhuma doação disponível.', 'aceitar');
        renderizarLista('pendencias', pendencias, 'Nenhuma pendência de retirada.', 'confirmar');
        renderizarLista('historico', historico, 'Nenhuma retirada concluída.', 'historico');
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
      }
    }

    function renderizarLista(idLista, doacoes, vazio, acao) {
      const lista = document.getElementById(idLista);
      lista.innerHTML = doacoes.length ? '' : `<li>${vazio}</li>`;
      for (const doacao of doacoes) {
        const li = document.createElement('li');
        if (acao === 'historico') {
          li.textContent = `${doacao.tipo} — ${doacao.quantidade} (retirada confirmada em ${doacao.concluida_em})`;
        } else {
          li.textContent = `${doacao.tipo} — ${doacao.quantidade} (até ${doacao.validade}) `;
          const botao = document.createElement('button');
          botao.textContent = acao === 'confirmar' ? 'Confirmar Retirada' : 'Aceitar';
          botao.onclick = () => acao === 'confirmar'
            ? confirmarRetirada(doacao.id)
            : aceitar(doacao.id);
          li.appendChild(botao);
        }
        lista.appendChild(li);
      }
    }

    async function aceitar(id) {
      try {
        const ong = document.getElementById('ong').value.trim();
        const doacao = await fetch(`/api/doacoes/${id}/aceitar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ong })
        }).then(lerResposta);
        mostrarMensagem(`Reserva exclusiva confirmada para ${doacao.ong}.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
        await carregar();
      }
    }

    async function confirmarRetirada(id) {
      try {
        const ong = document.getElementById('ong').value.trim();
        const doacao = await fetch(`/api/doacoes/${id}/confirmar-retirada`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ong })
        }).then(lerResposta);
        mostrarMensagem(`Retirada confirmada para ${doacao.ong}.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
        await carregar();
      }
    }

    document.getElementById('ong').onchange = carregar;

    document.getElementById('publicar').onclick = async () => {
      try {
        const doacao = await fetch('/api/doacoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tipo: document.getElementById('tipo').value,
            quantidade: document.getElementById('quantidade').value,
            validade: document.getElementById('validade').value
          })
        }).then(lerResposta);
        mostrarMensagem(`Doação #${doacao.id} publicada com sucesso.`, 'sucesso');
        await carregar();
      } catch (erro) {
        mostrarMensagem(erro.message, 'erro');
      }
    };

    carregar();
  </script>
</body>
</html>
